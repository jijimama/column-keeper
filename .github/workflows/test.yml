name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true # .ruby-version と Gemfile.lock を読み、gem をキャッシュ

      - name: Prepare DB
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: Run RSpec
        run: bundle exec rspec

  frontend:
    name: Frontend (Vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm test
