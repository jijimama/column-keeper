# 過去コラムCSVと新聞・コラムのマッピング。
# CSV はヘッダなし4列「年,月,日,本文」。空ファイルOK。
#
# 取り込み:
#   bin/rails columns:import_all
#
# scrape: ブロックがある source は POST /api/scrapes で
# 最新コラムをスクレイピングできる（静的HTML対応のみ）。
#
# scrape: のキー
#   base_url        : 一覧 or 詳細URL
#   list_selector   : 一覧記事リンクのCSS（空なら base_url を詳細扱い）
#   list_index      : 何番目のリンクか（既定 0）
#   detail_base_url : 詳細URLが相対のときの基底
#   detail_selector : 詳細本文のCSS
#   date_selector   : 日付のCSS
#   date_regexp     : 日付文字列の正規表現（$1=年, $2=月, $3=日）
#   replace_rules   : URL置換（例: {detail: moredetail}）

# --- ログイン/JS要のため未対応 ---
- file: asahi_tensei.csv
  newspaper: 朝日新聞
  column: 天声人語
- file: tokyo_hissen.csv
  newspaper: 東京新聞
  column: 筆洗

# --- 全国紙 ---
- file: mainichi_yoroku.csv
  newspaper: 毎日新聞
  column: 余録
  scrape:
    base_url: https://mainichi.jp/yoroku/
    list_selector: "ul.articlelist li a"
    list_index: 0
    detail_base_url: "https:"
    detail_selector: "section#articledetail-body p"
    date_selector: "span.articletag-date"
    date_regexp: '(\d{4})/(\d{1,2})/(\d{1,2})'

# --- 北海道・東北 ---
- file: tooku_tenchijin.csv
  newspaper: 東奥日報
  column: 天地人
  scrape:
    base_url: https://www.toonippo.co.jp/category/tenchijin
    list_selector: 'a[href^="/articles/-/"]'
    detail_base_url: https://www.toonippo.co.jp
    detail_selector: "div.article-body p"
    date_selector: "div.pubdate"
    date_regexp: '(\d{4})年(\d{1,2})月(\d{1,2})日'

- file: mutsu_toukagen.csv
  newspaper: 陸奥新報
  column: 冬夏言
  scrape:
    base_url: https://mutsushimpo.com/toukagen/
    list_selector: "div.entry_panel_wrap article a"
    detail_selector: "div.post_body p"
    date_selector: "p.post_date"
    date_regexp: '(\d{4})/(\d{1,2})/(\d{1,2})'

